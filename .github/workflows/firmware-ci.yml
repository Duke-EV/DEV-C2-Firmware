name: Firmware CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  lint:
    name: Lint C++ code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run lint
        run: make lint

  build:
    name: Build board firmware
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        board:
          - communications
          - joulemeter
          - motor-controller
          - peripherals
          - power-distribution
          - throttle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build ${{ matrix.board }}
        run: make build BOARD=${{ matrix.board }}
