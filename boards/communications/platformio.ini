[env:comms_board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board_build.partitions = huge_app.csv
board = esp32-c5-devkitc-1
framework = arduino
build_flags =
	-D NOTECARD_SDA_PIN=0
	-D NOTECARD_SCL_PIN=1
	-D VEHICLE_TWAI_TX_PIN=23
	-D VEHICLE_TWAI_RX_PIN=24
	-D TELEMETRY_BUTTON_PIN=4
	-D NOTECARD_PRODUCT_UID=\"com.duke-electric-vehicles:replace-me\"
lib_deps =
	../../lib/libcannetwork
	remotexy/RemoteXY@^3.1.14
	blues/Blues Wireless Notecard@^1.8.5
monitor_speed = 115200
upload_speed = 921600
extra_scripts =
upload_protocol = esptool
